<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Migration Assistant</title>
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>App Migration Assistant</h1>
        <p>
          Move an installed app to its new repository, together with its
          configuration and its internal data.
        </p>
      </header>

      <section id="environment" class="banners"></section>
      <section id="errors" class="banners"></section>
      <section id="plans" class="plans"></section>
    </main>

    <dialog id="migration">
      <form method="dialog">
        <h2 id="dialog-title">Migrate</h2>
        <p id="dialog-summary" class="summary"></p>
        <p id="dialog-notes" class="notes"></p>

        <fieldset id="dialog-choices">
          <legend>Steps</legend>
        </fieldset>

        <ol id="dialog-steps" class="steps" hidden></ol>
        <pre id="dialog-log" class="log" hidden></pre>

        <menu>
          <button value="cancel" id="dialog-cancel" type="submit">Cancel</button>
          <button value="start" id="dialog-start" type="button" class="primary">
            Start migration
          </button>
        </menu>
      </form>
    </dialog>

    <script src="static/app.js"></script>
  </body>
</html>
